<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<title>Power BI 量本利分析 · 圖解導覽（影片舞台）</title>
<style>
:root{--bg0:#070d2b;--cyan:#27d3ff;--ink:#0b1a52;--ink2:#4a5f9a;--orange:#ff9b4a;--mint:#5ee0c0;--gold:#ffd27a;--red:#ff7a8a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070d2b;font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1500px 950px at 70% 15%,#1b348f 0%,#101c5c 42%,#070d2b 100%)}
#grid{position:absolute;inset:-100px;opacity:.09;background-image:linear-gradient(#8fb4ff 1px,transparent 1px),linear-gradient(90deg,#8fb4ff 1px,transparent 1px);background-size:80px 80px}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
#tag{position:absolute;left:60px;top:30px;font-size:22px;letter-spacing:.14em;color:#a9c4ff;z-index:50;display:flex;align-items:center;gap:30px}
#tag i{width:14px;height:14px;border-radius:3px;background:var(--cyan);display:inline-block;box-shadow:18px 0 0 -2px var(--orange)}
#pg{position:absolute;left:760px;top:24px;z-index:50;font-size:24px;font-weight:800;color:#07102e;background:var(--cyan);padding:2px 20px;border-radius:18px;opacity:0;white-space:nowrap}
#step{position:absolute;right:60px;top:32px;font-size:22px;color:#a9c4ff;letter-spacing:.12em;z-index:50}
#badge{position:absolute;right:190px;top:26px;z-index:50;font-size:21px;font-weight:800;color:#07102e;background:var(--gold);padding:3px 16px;border-radius:16px}
#prog{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--cyan),var(--orange));z-index:60}
#sub{position:absolute;left:0;right:0;bottom:44px;text-align:center;z-index:55;height:66px}
#sub span{display:inline-block;padding:10px 34px;border-radius:40px;background:rgba(4,10,34,.78);font-size:40px;letter-spacing:.06em;line-height:1.25;backdrop-filter:blur(6px);max-width:1800px}
.scene{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.win{position:absolute;left:60px;top:90px;width:1800px;height:810px;border-radius:22px;overflow:hidden;background:#0d1642;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.12)}
.cam{position:absolute;left:0;top:0;width:1200px;height:1500px;transform-origin:0 0}
.cam img{position:absolute;left:0;top:0;width:1200px;height:1500px;display:block}
.spot{position:absolute;border:4px solid var(--orange);border-radius:10px;box-shadow:0 0 0 4000px rgba(5,12,40,.30);opacity:0}
.cap{position:absolute;left:60px;top:908px;max-width:1800px;padding:6px 26px 6px 22px;border-radius:14px;background:rgba(255,255,255,.97);color:var(--ink);border-left:10px solid var(--orange);font-size:34px;font-weight:800;letter-spacing:.03em;opacity:0;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap;line-height:1.3}
.big{position:absolute;font-weight:800;letter-spacing:.02em}
.card{position:absolute;border-radius:22px;background:rgba(255,255,255,.97);color:var(--ink);box-shadow:0 22px 60px rgba(0,0,0,.4)}
.mono{font-family:Consolas,"Cascadia Mono","Microsoft JhengHei",monospace}
</style></head>
<body><div id="stage">
<div id="grid"></div>
<div class="orb" id="o1" style="width:520px;height:520px;background:#1b8fd6;left:-120px;top:600px"></div>
<div class="orb" id="o2" style="width:420px;height:420px;background:#ff9b4a;right:-80px;top:-100px;opacity:.16"></div>
<div id="tag"><i></i>POWER BI · 量本利分析 · 圖解導覽</div>
<div id="pg"></div>
<div id="badge">示範資料（模擬）</div><div id="step"></div>
<div id="scenes"></div>
<div id="sub"><span></span></div>
<div id="prog"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,t)=>a+(b-a)*t;
const eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, eO=t=>1-Math.pow(1-clamp(t),3), eOB=t=>{t=clamp(t);const c=1.5;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const IMG=i=>`../assets/p${i}_film.jpg`;
let TL, S={}, SC={};
const IW=1200, IH=1500, AW=1800, AH=810, MAXZ=3.4;

/* 句界：旁白從 sc.A 開始，句長以字數比例估計；字幕與鏡頭共用 */
function clausesOf(sc){ const parts=sc.text.replace(/\s+/g,' ').split(/(?<=[，。？：；])/).map(s=>s.trim()).filter(Boolean);
  const tot=parts.reduce((a,p)=>a+p.length,0); let acc=0; const A=.5+(sc.lead||0), V=sc.vo;
  return parts.map(p=>{const t0=A+V*acc/tot; acc+=p.length; return {t0,t1:A+V*acc/tot,text:p.replace(/[，。？：；]$/,'')};}); }
const ct=(k,i,d=0,f=0)=>{const c=SC[k].cl[i]; return c.t0+f*(c.t1-c.t0)+d;};

/* 螢幕視窗 + 鏡頭 + 聚光框 + 說明列（座標＝頁面 1200×1500） */
function camOf(r){let [x,y,w,h]=r; if(w<1100){w*=1.05;h*=1.05;} return {s:Math.min(AW/w,AH/h,MAXZ),cx:x+r[2]/2,cy:y+r[3]/2};}
function place(s,cx,cy){
  const pw=IW*s, ph=IH*s; let tx=AW/2-cx*s, ty=AH/2-cy*s;
  tx= pw<=AW ? (AW-pw)/2 : Math.min(0,Math.max(AW-pw,tx));
  ty= ph<=AH ? (AH-ph)/2 : Math.min(0,Math.max(AH-ph,ty));
  return [tx,ty];}
const WHOLE=[0,0,1200,1500];
function shotScene(k,pg,label,shots,masks=[]){
  const el=document.createElement('div'); el.className='scene';
  el.innerHTML=`<div class="win"><div class="cam"><img src="${IMG(pg)}">${masks.map(m=>`<div style="position:absolute;left:${m[0]}px;top:${m[1]}px;width:${m[2]}px;height:${m[3]}px;border-radius:10px;background:repeating-linear-gradient(45deg,#e3e8f3,#e3e8f3 14px,#d3dbec 14px,#d3dbec 28px);display:flex;align-items:center;justify-content:center;text-align:center;color:#4a5f9a;font-weight:800;font-size:20px;line-height:1.35;padding:20px">${m[4]}</div>`).join('')}<div class="spot"></div></div></div><div class="cap"></div>`;
  const cam=el.querySelector('.cam'), spot=el.querySelector('.spot'), cap=el.querySelector('.cap');
  let ready=false; const TR=.7;
  function prep(){ let prev=-1; shots.forEach((s,i)=>{ s.T = s.t!=null ? s.t : ct(k,s.c,s.d||0,s.f||0); s.T=Math.max(s.T,prev+.05); prev=s.T; if(!s.cam) s.cam=shots[i-1].cam; }); ready=true; }
  function upd(tl,D){
    if(!ready) prep();
    let i=0; for(let j=0;j<shots.length;j++) if(tl>=shots[j].T) i=j;
    const cur=shots[i], t0=cur.T, p=i===0?1:eIO(clamp((tl-t0)/TR));
    const a=camOf(i===0?cur.cam:shots[i-1].cam), b=camOf(cur.cam);
    const drift=1+.04*tl/D;
    const s=Math.exp(lerp(Math.log(a.s),Math.log(b.s),p))*drift, cx=lerp(a.cx,b.cx,p)+8*(tl/D-.5), cy=lerp(a.cy,b.cy,p);
    const [tx,ty]=place(s,cx,cy); cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
    const sp=cur.spot, prev=i>0?shots[i-1].spot:null, same=sp&&prev&&sp.every((v,n)=>v===prev[n]);
    let rect=null, al=0;
    if(same){rect=sp;al=1;}
    else if(sp&&prev){ if(p<.35){rect=prev;al=1-p/.35;} else if(p>.65){rect=sp;al=(p-.65)/.35;} }
    else if(sp){rect=sp;al=clamp((tl-t0-.3)/.35);}
    else if(prev){rect=prev;al=1-clamp((tl-t0)/.25);}
    if(rect&&al>0){
      spot.style.left=rect[0]+'px';spot.style.top=rect[1]+'px';spot.style.width=rect[2]+'px';spot.style.height=rect[3]+'px';
      spot.style.borderWidth=(4/s)+'px';spot.style.borderRadius=(10/s)+'px';
      spot.style.boxShadow=`0 0 0 4000px rgba(5,12,40,${.30*al})`; spot.style.opacity=al;
    } else spot.style.opacity=0;
    if(cap.dataset.t!==(cur.cap||'')){cap.textContent=cur.cap||''; cap.dataset.t=cur.cap||'';}
    const end=(i+1<shots.length?shots[i+1].T:D); cap.style.opacity=cur.cap?clamp((tl-t0-.1)/.3)*clamp((end-tl)/.2):0;
    cap.style.transform=`translateY(${(1-eO((tl-t0-.1)/.45))*14}px)`;
  }
  return {el,upd,label};
}
const mkCard=(host,css,html)=>{const d=document.createElement('div');d.className='card';d.style.cssText=css;d.innerHTML=html;host.appendChild(d);return d;};
const PAGES=['首頁','經營概覽','公司量本利分析','公司保本與利潤模擬','單品貢獻與保本模擬','口徑說明'];
const NS='http://www.w3.org/2000/svg';
const sv=(host,tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);host.appendChild(e);return e;};

function build(){
  const host=document.getElementById('scenes');

  /* s01 開場：銷售額漲、利潤沒漲 → 下個月至少多少營收 → 標題 */
  { const el=document.createElement('div'); el.className='scene';
    el.innerHTML=`<div class="win" style="left:1130px;top:100px;width:648px;height:810px;border-radius:20px"><img id="s1bg" src="${IMG(0)}" style="position:absolute;left:0;top:0;width:648px;height:810px;transform-origin:50% 40%"></div>
    <div class="card" id="s1a" style="left:80px;top:130px;width:960px;height:330px;opacity:0"></div>
    <div class="big" id="s1b" style="left:84px;top:500px;width:1000px;font-size:62px;line-height:1.25;color:#fff;opacity:0">下個月，至少要做到<span style="color:var(--orange)">多少營收</span>，<br>才不會虧？</div>
    <div class="big" id="s1c" style="left:84px;top:720px;font-size:104px;line-height:1.1;opacity:0">量本利分析</div>
    <div class="big" id="s1d" style="left:90px;top:858px;font-size:42px;font-weight:700;color:var(--cyan);letter-spacing:.14em;opacity:0">POWER BI · 6 張頁面　把保本點算清楚</div>`;
    host.appendChild(el);
    const a=el.querySelector('#s1a');
    a.innerHTML=`<svg viewBox="0 0 960 330" width="960" height="330">
      <text x="40" y="60" font-size="34" font-weight="800" fill="#0b1a52">銷售額漲了…</text>
      <rect id="rv0" x="60" y="230" width="150" height="30" rx="6" fill="#7da2ff"/><rect id="rv1" x="60" y="190" width="150" height="70" rx="6" fill="#7da2ff" opacity="0"/>
      <rect id="rv2" x="260" y="230" width="150" height="30" rx="6" fill="#2757c9"/>
      <text x="135" y="290" font-size="26" text-anchor="middle" fill="#4a5f9a">去年</text><text x="335" y="290" font-size="26" text-anchor="middle" fill="#4a5f9a">今年</text>
      <text x="215" y="150" font-size="30" font-weight="800" fill="#2757c9">營收 ▲</text>
      <rect x="540" y="215" width="120" height="45" rx="6" fill="#ffb98a"/><rect x="700" y="215" width="120" height="45" rx="6" fill="#ff9b4a"/>
      <text x="600" y="290" font-size="26" text-anchor="middle" fill="#4a5f9a">去年</text><text x="760" y="290" font-size="26" text-anchor="middle" fill="#4a5f9a">今年</text>
      <text x="680" y="150" font-size="30" font-weight="800" fill="#c8581a">利潤 ➜ ？</text>
      <text x="540" y="60" font-size="34" font-weight="800" fill="#0b1a52">利潤沒跟著漲？</text></svg>`;
    // 為什麼用示意長條：只表達「營收上升、利潤持平」的問題意識，不代表報表真實數字
    S.s01={el,label:'',upd:(tl,D)=>{
      const bg=el.querySelector('#s1bg'); bg.style.transform=`scale(${1+.05*tl/D})`;
      const t0=.2, a1=ct('s01',0,-.1);
      a.style.opacity=clamp((tl-t0)/.4); a.style.transform=`translateY(${(1-eO((tl-t0)/.5))*30}px)`;
      const g=eIO(clamp((tl-a1-.3)/1.2)); const r1=a.querySelector('#rv1'); r1.setAttribute('opacity',1); r1.setAttribute('y',230-30-70*g); r1.setAttribute('height',30+70*g);
      a.querySelector('#rv2').setAttribute('y',230-70*g); a.querySelector('#rv2').setAttribute('height',30+70*g); r1.setAttribute('opacity',0);
      const b=el.querySelector('#s1b'), tb=ct('s01',2,-.1); b.style.opacity=clamp((tl-tb)/.4); b.style.transform=`translateY(${(1-eO((tl-tb)/.5))*24}px)`;
      const c=el.querySelector('#s1c'), tc=ct('s01',5,-.1); c.style.opacity=clamp((tl-tc)/.35); c.style.transform=`scale(${.9+.1*eOB((tl-tc)/.6)}) translateY(${(1-eO((tl-tc)/.5))*20}px)`;
      const d=el.querySelector('#s1d'), td=ct('s01',6,-.1); d.style.opacity=clamp((tl-td)/.4);
    }}; }

  /* s02 量、價、本、利：用每 100 元收入拆開 */
  { const el=document.createElement('div'); el.className='scene';
    el.innerHTML=`<div class="big" style="left:0;right:0;top:76px;text-align:center;font-size:58px">量・價・本・利</div><div id="s2c"></div>
      <svg id="s2svg" width="1920" height="1080" style="position:absolute;left:0;top:0"></svg>`;
    host.appendChild(el); const cc=el.querySelector('#s2c'), svg=el.querySelector('#s2svg');
    const Q=[['量','銷量','#27d3ff'],['價','單價','#7da2ff'],['本','成本','#ff9b4a'],['利','利潤','#5ee0c0']];
    const cards=Q.map((q,i)=>mkCard(cc,`left:${230+i*360}px;top:170px;width:320px;height:150px;border-top:10px solid ${q[2]};opacity:0;display:flex;align-items:center;justify-content:center;gap:20px`,
      `<span style="font-size:96px;font-weight:800;color:#0b1a52">${q[0]}</span><span style="font-size:40px;font-weight:800;color:#4a5f9a">${q[1]}</span>`));
    const eq=document.createElement('div'); eq.className='big'; eq.style.cssText='left:230px;top:335px;width:1460px;text-align:center;font-size:46px;opacity:0;white-space:nowrap';
    eq.innerHTML='量 <span style="color:var(--orange)">×</span> 價 <span style="color:var(--orange)">＝</span> 收入'; cc.appendChild(eq);
    // 每 100 元收入（2026 年 8 月：貢獻率 30.7%）→ 棒子 x:210..1710 = 100 元
    const X0=210,W=1500,u=W/100;
    const bar1=document.createElement('div'); bar1.style.cssText='position:absolute;left:210px;top:470px;width:1500px;height:110px;opacity:0'; cc.appendChild(bar1);
    bar1.innerHTML=`<div style="position:absolute;left:0;top:-48px;font-size:34px;font-weight:800;color:#dbe6ff">每賣 100 元收入（2026 年 8 月的比例；變動成本 ＝ 100 − 30.7，推算）</div>
      <div id="vc" style="position:absolute;left:0;top:0;width:${69.3*u}px;height:110px;border-radius:14px 0 0 14px;background:#7da2ff;color:#07102e;font-size:38px;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap">變動成本　約 69.3 元</div>
      <div id="cm" style="position:absolute;left:${69.3*u}px;top:0;width:${30.7*u}px;height:110px;border-radius:0 14px 14px 0;background:#27d3ff;color:#07102e;font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap">邊際貢獻 30.7 元</div>`;
    const note1=document.createElement('div'); note1.className='big'; note1.style.cssText='left:210px;top:600px;font-size:30px;font-weight:700;color:#a9c4ff;opacity:0;white-space:nowrap';
    note1.innerHTML='🔧 變動成本：材料、人工…　<b style="color:var(--gold)">跟著銷量走</b>　　　　　　　　　 🏢 固定費用：租金、折舊…　<b style="color:var(--gold)">賣多賣少都要付</b>'; cc.appendChild(note1);
    const bar2=document.createElement('div'); bar2.style.cssText=`position:absolute;left:${210+69.3*u}px;top:700px;width:${30.7*u}px;height:110px;opacity:0`; cc.appendChild(bar2);
    bar2.innerHTML=`<div style="position:absolute;left:-${69.3*u}px;top:20px;width:${69.3*u-24}px;text-align:right;font-size:34px;font-weight:800;color:#dbe6ff">邊際貢獻要先去蓋固定費用 ▶</div>
      <div id="fx" style="position:absolute;left:0;top:0;width:${26.4*u}px;height:110px;border-radius:14px 0 0 14px;background:#ff9b4a;color:#07102e;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap">固定費用 26.4</div>
      <div id="pf" style="position:absolute;left:${26.4*u}px;top:0;width:${4.3*u}px;height:110px;border-radius:0 14px 14px 0;background:#5ee0c0;color:#07102e;font-size:30px;font-weight:800;white-space:nowrap"><span style="position:absolute;left:calc(100% + 14px);top:30px;font-size:36px;color:#5ee0c0">利潤 4.4</span></div>`;
    const note2=document.createElement('div'); note2.className='big'; note2.style.cssText='left:210px;top:830px;font-size:27px;font-weight:700;color:#a9c4ff;opacity:0;white-space:nowrap';
    note2.textContent='換算（推算）：固定費用 374 ÷ 營收 1,418 ≈ 26.4；利潤 62 ÷ 1,418 ≈ 4.4（單位：元／每 100 元收入）'; cc.appendChild(note2);
    S.s02={el,label:'',upd:(tl,D)=>{
      cards.forEach((c,i)=>{const st=.35+i*.18,v=eOB((tl-st)/.5);c.style.opacity=clamp((tl-st)/.25);c.style.transform=`translateY(${(1-v)*50}px)`;
        const hot=(i<2&&tl>=ct('s02',3,-.1)&&tl<ct('s02',5,-.2))||(i===2&&tl>=ct('s02',5,-.1)&&tl<ct('s02',11,-.2))||(i===3&&tl>=ct('s02',13,-.1));
        c.style.boxShadow=hot?'0 0 0 6px #ff9b4a,0 24px 60px rgba(0,0,0,.5)':'';});
      const te=ct('s02',3,-.1); eq.style.opacity=clamp((tl-te)/.4)*clamp((ct('s02',5,-.2)-tl)/.3+.0); eq.style.transform=`translateY(${(1-eO((tl-te)/.5))*16}px)`;
      const tb=ct('s02',5,-.1); bar1.style.opacity=clamp((tl-tb)/.4); bar1.style.transform=`scaleX(${.3+.7*eO((tl-tb)/.7)})`; bar1.style.transformOrigin='0 50%';
      const cmEl=bar1.querySelector('#cm'); cmEl.style.opacity=tl<ct('s02',11,-.3)?.25:1;
      note1.style.opacity=clamp((tl-ct('s02',8,-.2))/.5)*(tl<ct('s02',13,-.2)?1:.35);
      const t2=ct('s02',8,-.2); bar2.style.opacity=clamp((tl-t2)/.4); bar2.style.transform=`scaleX(${.2+.8*eO((tl-t2)/.8)})`; bar2.style.transformOrigin='100% 50%';
      const pf=bar2.querySelector('#pf'); const tpf=ct('s02',13,-.1); pf.style.opacity=clamp((tl-tpf)/.4); pf.style.boxShadow=tl>=ct('s02',15,-.1)?'0 0 0 6px #ffd27a':'';
      note2.style.opacity=clamp((tl-tpf)/.5);
    }}; }

  /* s03 保本公式：收入線 × 總成本線 → 保本點 → 安全邊際 */
  { const el=document.createElement('div'); el.className='scene';
    el.innerHTML=`<div class="big" style="left:90px;top:76px;font-size:56px">保本 ＝ 收入剛好等於總成本</div>
      <div class="card" style="left:60px;top:170px;width:1040px;height:730px;padding:0;overflow:hidden"><svg id="s3svg" viewBox="0 0 1040 730" width="1040" height="730"></svg></div>
      <div id="s3f"></div>`;
    host.appendChild(el); const svg=el.querySelector('#s3svg'), ff=el.querySelector('#s3f');
    // 圖面：x 0..2000 萬 → 80..1000 px；y 0..2000 → 660..60 px
    const X=v=>80+v/2000*920, Y=v=>660-v/2000*600;
    [0,500,1000,1500,2000].forEach(v=>{sv(svg,'line',{x1:80,x2:1000,y1:Y(v),y2:Y(v),stroke:'#e1e8f6','stroke-width':1.5});
      const t=sv(svg,'text',{x:70,y:Y(v)+7,'text-anchor':'end','font-size':20,fill:'#6a7bb0'}); t.textContent=v.toLocaleString();
      const t2=sv(svg,'text',{x:X(v),y:690,'text-anchor':'middle','font-size':20,fill:'#6a7bb0'}); t2.textContent=v.toLocaleString();});

    S.s11={el,label:'',upd:(tl,D2)=>{
      const tF=.9,tD=.4,tE=ct('s11',5,-.2);
      F.forEach((n,i)=>{const st=tF+i*.15,v=eOB((tl-st)/.5);n.el.style.opacity=clamp((tl-st)/.25);
        const act=(n.k==='fx'&&tl>=ct('s11',6,-.2)&&tl<ct('s11',8,-.2));
        n.el.style.transform=`scale(${(.7+.3*v)*(act?1.05:1)})`;n.el.style.boxShadow=act?'0 0 0 6px #ff9b4a,0 24px 60px rgba(0,0,0,.5)':'';});
      D.forEach((n,i)=>{const st=tD+i*.12,v=eOB((tl-st)/.5);n.el.style.opacity=clamp((tl-st)/.25);n.el.style.transform=`scale(${.7+.3*v})`;});
      lines.forEach((l,i)=>{const q=eIO(clamp((tl-tE-i*.1)/.9));const act=(l.f==='fx'&&tl>=ct('s11',6,-.2)&&tl<ct('s11',8,-.2));
        l.p.setAttribute('stroke-dashoffset',l.L*(1-q));l.p.setAttribute('opacity',(act?1:.55)*q);l.p.setAttribute('stroke',act?'#ff9b4a':'#7aa9ff');l.p.setAttribute('stroke-width',act?7:4);});
      sp.forEach((c,i)=>{const st=[ct('s11',3,-.2),ct('s11',4,-.2),ct('s11',5,-.2),ct('s11',8,-.2)][i];c.style.opacity=clamp((tl-st)/.3);c.style.transform=`translateY(${(1-eO((tl-st)/.4))*20}px)`;});
      note.style.opacity=clamp((tl-ct('s11',6,-.1))/.4)*clamp((ct('s11',8,-.1)-tl)/.3);
      const tm=ct('s11',8,-.2); ms.style.opacity=clamp((tl-tm)/.5); ms.style.transform=`translateY(${(1-eO((tl-tm)/.5))*20}px)`;
    }}; }

  /* s12 結尾 */
  { const el=document.createElement('div'); el.className='scene';
    el.innerHTML=`<div id="s12w"></div>
    <div class="big" id="s12h" style="left:760px;top:90px;font-size:62px;line-height:1.2;opacity:0">不只是一條保本線，<br>而是想清楚<span style="color:var(--orange)">哪一項在拖累利潤</span></div>
    <div id="s12c"></div>
    <div id="s12t" style="position:absolute;left:60px;top:890px;width:1800px;padding:12px 28px;border-radius:20px;background:rgba(7,13,43,.78);border:2px solid rgba(169,196,255,.5);font-size:23px;line-height:1.45;color:#e6eeff;opacity:0">
      <b style="color:var(--gold)">畫面與資料：</b>公開發佈的 Power BI 報告（封面署名 @Ken.Liu）；資料為示範（模擬）資料，不代表任何真實公司。
      <b style="color:var(--gold)">　介紹文章：</b>〈賣多少才不虧？這個 Power BI 量本利分析把保本點算清楚了〉（簡體轉繁體）。</div>`;
    host.appendChild(el); const w=el.querySelector('#s12w'), cc=el.querySelector('#s12c'); const th=[];
    for(let i=0;i<6;i++){const d=document.createElement('div');d.className='card';d.style.cssText=`left:${60+(i%3)*226}px;top:${110+Math.floor(i/2*0)+Math.floor(i/3)*(280+14)}px;width:212px;height:280px;padding:6px;opacity:0;overflow:hidden`;
      d.innerHTML=`<div style="width:200px;height:215px;overflow:hidden;border-radius:8px;background:#0d1642"><img src="${IMG(i)}" style="width:100%;display:block"></div><div style="font-size:19px;font-weight:800;color:var(--ink);line-height:1.2;margin-top:4px"><span style="color:#e9792f">${i?'第'+i+'頁':'封面'}</span> ${PAGES[i]}</div>`;w.appendChild(d);th.push(d);}
    const K=[['收入','賣多少、賣什麼價','#27d3ff'],['成本結構','變動成本的比例','#ff9b4a'],['固定投入','租金、折舊、人員','#5ee0c0']];
    const kc=K.map((k,i)=>mkCard(cc,`left:${760+i*370}px;top:300px;width:350px;height:130px;padding:14px 20px;opacity:0;border-top:10px solid ${k[2]}`,`<div style="font-size:42px;font-weight:800">${k[0]}</div><div style="font-size:23px;color:#4a5f9a;margin-top:4px">${k[1]}</div>`));

      const h=el.querySelector('#s12h'),th0=.2;h.style.opacity=clamp((tl-th0)/.4);h.style.transform=`translateY(${(1-eO((tl-th0)/.6))*24}px)`;

  TL.scenes.forEach(s=>{const o=S[s.k];o.el.id='sc_'+s.k;host.appendChild(o.el);});

window.init=async function(tl){
  TL=tl; TL.scenes.forEach(s=>{SC[s.k]={sc:s,cl:clausesOf(s)};}); build();
  await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
  await document.fonts.ready; return {scenes:TL.scenes.length,total:TL.total};
};
window.render=function(t){
  const OV=.25; let label='',pgl='';
  TL.scenes.forEach((sc,idx)=>{ const o=S[sc.k], tl=t-sc.T; const el=o.el;
    if(tl<-OV-.01||tl>sc.D+.01){el.style.display='none';return;} el.style.display='block';
    const ein=eO((tl+OV)/(OV+.12)), eout=clamp((sc.D-tl)/OV); const last=idx===TL.scenes.length-1;
    el.style.opacity=(idx===0?1:ein)*(last?1:eout);
    el.style.transform=`translateY(${(idx===0?0:(1-ein)*18)}px)`;
    o.upd(Math.max(0,tl),sc.D); if(tl>=.3&&tl<sc.D-.3){label=(idx+1)+' / '+TL.scenes.length; pgl=o.label||'';}
  });
  document.getElementById('step').textContent=label;
  const pg=document.getElementById('pg'); pg.textContent=pgl; pg.style.opacity=pgl?1:0;
  let txt=''; let vis=0; TL.scenes.forEach(sc=>{const tl=t-sc.T; if(tl<0||tl>sc.D) return; SC[sc.k].cl.forEach(s=>{if(tl>=s.t0&&tl<s.t1){txt=s.text;vis=clamp((tl-s.t0)/.15)*clamp((s.t1-tl)/.12+.2);}});});
  const sp=document.querySelector('#sub span'); sp.textContent=txt; sp.style.opacity=txt?vis:0; sp.style.display=txt?'inline-block':'none';
  document.getElementById('grid').style.transform=`translate(${-(t*6)%80}px,${-(t*4)%80}px)`;
  document.getElementById('o1').style.transform=`translate(${Math.sin(t*.2)*60}px,${Math.cos(t*.17)*40}px)`;
  document.getElementById('o2').style.transform=`translate(${Math.cos(t*.15)*50}px,${Math.sin(t*.21)*40}px)`;
  document.getElementById('prog').style.width=(100*t/TL.total)+'%';
};
